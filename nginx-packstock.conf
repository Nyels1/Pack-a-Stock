# Pack-a-Stock: HTTP -> HTTPS redirect
server {
    listen 80;
    server_name packstock.198.71.54.179.nip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Pack-a-Stock: SSL termination (receives traffic from stream SNI router on 8443)
server {
    listen 127.0.0.1:8443 ssl;
    server_name packstock.198.71.54.179.nip.io;

    ssl_certificate /etc/letsencrypt/live/packstock.198.71.54.179.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/packstock.198.71.54.179.nip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL_packstock:10m;
    ssl_session_timeout 10m;

    client_max_body_size 50M;

    # API + Admin + Static -> Django backend
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Frontend -> Next.js
    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://apis.google.com https://accounts.google.com; frame-src 'self' https://accounts.google.com https://*.firebaseapp.com; connect-src 'self' https://apis.google.com https://accounts.google.com https://securetoken.googleapis.com https://identitytoolkit.googleapis.com https://packstock.198.71.54.179.nip.io wss://packstock.198.71.54.179.nip.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://packstock.198.71.54.179.nip.io https://lh3.googleusercontent.com;" always;
    }
}
